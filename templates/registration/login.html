{% extends "base.html" %}
{% block title %}Login | EduTrack{% endblock %}
{% block content %}
<div class="auth-wrapper" style="margin: -1.5rem -0.75rem;">
  <div class="auth-card">
    <h3 class="mb-1 fw-bold"><i class="bi bi-mortarboard-fill text-primary"></i> EduTrack Login</h3>
    <p class="text-muted mb-4">EduTrack – Student Management & Analytics System</p>
    {% if form.errors %}
      <div class="alert alert-danger">Invalid username or password.</div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign In</button>
      <input type="hidden" name="next" value="{{ next }}">
    </form>
  </div>
</div>
{% endblock %}
