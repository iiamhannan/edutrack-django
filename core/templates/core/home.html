{% extends "base.html" %}
{% block title %}Dashboard | EduTrack{% endblock %}
{% block content %}
<h2 class="mb-4 fw-bold">Dashboard</h2>

<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card-stat bg-grad-2">
      <div class="d-flex justify-content-between align-items-center">
        <div><small>Total Courses</small><h2>{{ course_count }}</h2></div>
        <i class="bi bi-book-fill fs-1 opacity-50"></i>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card-stat bg-grad-3">
      <div class="d-flex justify-content-between align-items-center">
        <div><small>Departments</small><h2>{{ department_count }}</h2></div>
        <i class="bi bi-diagram-3-fill fs-1 opacity-50"></i>
      </div>
    </div>
  </div>
</div>

<div class="table-card">
  <h5 class="fw-bold mb-3">Quick Actions</h5>
  <div class="d-grid gap-2" style="max-width:300px;">
    <a href="{% url 'core:department-add' %}" class="btn btn-outline-primary"><i class="bi bi-diagram-3"></i> Add Department</a>
    <a href="{% url 'core:course-add' %}" class="btn btn-outline-primary"><i class="bi bi-journal-plus"></i> Add Course</a>
  </div>
</div>
{% endblock %}
