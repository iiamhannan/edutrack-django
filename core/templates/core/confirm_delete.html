{% extends "base.html" %}
{% block title %}Confirm Delete | EduTrack{% endblock %}
{% block content %}
<div class="table-card mx-auto" style="max-width: 500px;">
  <h5 class="fw-bold text-danger"><i class="bi bi-exclamation-triangle-fill"></i> Confirm Delete</h5>
  <p class="mt-3">Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-secondary">Cancel</a>
  </form>
</div>
{% endblock %}
