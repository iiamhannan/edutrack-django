{% extends "base.html" %}
{% block title %}Courses | EduTrack{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h2 class="fw-bold mb-0">Courses</h2>
  <a href="{% url 'core:course-add' %}" class="btn btn-primary"><i class="bi bi-journal-plus"></i> Add Course</a>
</div>
<div class="table-card">
  <table class="table table-hover align-middle">
    <thead><tr><th>Code</th><th>Title</th><th>Credit Hours</th><th>Department</th><th></th></tr></thead>
    <tbody>
      {% for c in courses %}
      <tr>
        <td>{{ c.code }}</td><td>{{ c.title }}</td><td>{{ c.credit_hours }}</td><td>{{ c.department }}</td>
        <td class="text-end">
          <a href="{% url 'core:course-edit' c.pk %}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a>
          <a href="{% url 'core:course-delete' c.pk %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
        </td>
      </tr>
      {% empty %}<tr><td colspan="5" class="text-muted text-center py-3">No courses found.</td></tr>{% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
